<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT</title>
     <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <section class="contact-hero">
       <img src="assets/img/0WUNvRD9WqvPsXPTGB1DxqJbbYbYs2WkA7o.png" alt="contact img" width="1530" height="700">
     
    <div class="contact-title">
       <h1> Contact Us </h1>
    </div>
      </section>
   

    <section class="contact-section">
        <h3> Get In Touch </h3>
        <p>
            We'd love to hear from you! Whether you have a question,
            feedback, or need assistance, our team is always ready to help.
        </p>
        <div class="contact-info"> 

        <div class="contact-box">
                <h3> Address </h3>
                <p> library junction,<br>Colombo, Sri Lanka </p>
            </div>
         
        <div class="contact-box">
                <h3> Phone </h3>
                <p> 0112756543 </p>
        </div>  

        <div class="contact-box">
                <h3> Email </h3>
                <p>info@lexiconbooks.com</p>
            </div>

         </div>   

        <form class="contact-form"> 
        <input type="text" placeholder="Your Name" required>

        <input type="email" placeholder="Your Email" required>

        <textarea placeholder="Your Message" rows="6"></textarea>

        <button type="submit">Send Message</button>
    
        </form>

    </section>
    

</body>
</html>
