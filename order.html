<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDER</title>
     <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <img src="assets/img/jaredd-craig-floatingbook-unsplash-bookshop.webp" alt="img" width="1530" height="500px">
    
    <section class="order-section">

        <h1> Order Books </h1>

        <form action="index.html" class="order-form">

            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email Address" required>

            <input type="tel" placeholder="Phone Number" required>
            <input type="text" placeholder="Book Name" required>

            <input type="number" placeholder="Quantity" required>
            <textarea rows="5" placeholder="Delivery Address" required></textarea>

            <button type="submit">Submit Order</button>

        </form>

    </section>

</body>
</html>
